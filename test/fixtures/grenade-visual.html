<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>v0.2.7 grenade visual fixture</title>
    <style>
      body {
        margin: 0;
        background: #101b26;
        color: #dce7e7;
        font: 12px system-ui;
      }
      #game {
        height: 85dvh;
      }
      p {
        padding: 8px;
      }
      canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <p id="stats">
      Isolated real-simulation grenade fixture; not a normal-match performance
      measurement.
    </p>
    <script type="module">
      import Phaser from "phaser";
      import { Battle } from "/src/simulation.js";
      import { CombatVisuals } from "/src/combat-visuals.js";
      import { GrenadeVisuals } from "/src/grenade-visuals.js";
      import { drawGrenades, drawObstacle } from "/src/urban-visuals.js";
      import { obstacles } from "/src/world.js";
      const iso = (x, y) => ({ x: 300 + (x - y) * 20, y: 40 + (x + y) * 10 });
      class Fixture extends Phaser.Scene {
        create() {
          this.b = new Battle(() => 0.99, {
            map: "urban",
            variant: 0,
            grenades: true,
            tactical: true,
          });
          for (const u of this.b.units)
            Object.assign(u, { active: false, dead: true });
          Object.assign(this.b.units[0], {
            active: true,
            dead: false,
            x: 6,
            y: 10,
          });
          for (const id of [6, 7, 8])
            Object.assign(this.b.units[id], {
              active: true,
              dead: false,
              x: 6 + (id - 6),
              y: 15,
              reload: 100,
            });
          this.g = this.add.graphics();
          this.v = new CombatVisuals();
          this.f = new GrenadeVisuals();
          this.acc = 0;
          this.speed = Number(
            new URLSearchParams(location.search).get("speed") || 1,
          );
          this.cameras.main.setZoom(0.9).centerOn(iso(6, 13).x, iso(6, 13).y);
          window.fixtureSnapshot = () => ({
            time: this.b.time,
            stats: { ...this.b.grenadeStats },
            effects: this.f.effects.map((e) => ({ kind: e.kind })),
            grenades: this.b.grenades.map((g) => ({
              x: g.position.x,
              y: g.position.y,
              flightAge: this.b.time - g.thrownAt,
            })),
            result: this.b.result,
          });
        }
        update(_, delta) {
          if (!window.fixturePaused)
            this.acc += Math.min(delta / 1000, 0.1) * this.speed;
          while (this.acc >= 0.05) {
            this.b.step(0.05);
            this.acc -= 0.05;
          }
          this.v.update(
            this.b,
            delta / 1000,
            this.speed,
            !!window.fixturePaused,
          );
          this.f.update(
            this.b,
            delta / 1000,
            this.speed,
            !!window.fixturePaused,
          );
          const g = this.g;
          g.clear();
          for (const [key, type] of obstacles) {
            const [x, y] = key.split(",").map(Number);
            if (x < 12 && y >= 9 && y <= 18)
              drawObstacle(g, { x, y, type }, iso(x, y));
          }
          for (const u of this.b.units.filter((u) =>
            [0, 6, 7, 8].includes(u.id),
          ))
            this.v.drawUnit(g, this.b, u, iso(u.x, u.y), iso, false);
          drawGrenades(g, this.b, iso);
          this.f.draw(g, iso);
          document.querySelector("#stats").textContent =
            `REAL SIMULATION FIXTURE · ${this.speed}× · throws ${this.b.grenadeStats.thrown} · blasts ${this.b.grenadeStats.detonated}`;
        }
      }
      new Phaser.Game({
        type: Phaser.AUTO,
        parent: "game",
        pixelArt: true,
        antialias: false,
        scale: { mode: Phaser.Scale.RESIZE, width: "100%", height: "100%" },
        scene: Fixture,
      });
    </script>
  </body>
</html>
