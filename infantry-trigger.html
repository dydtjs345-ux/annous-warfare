<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>보병 · 수동 클립 검사</title><style>body{margin:0;background:#111d28;color:#e1ebef;font:15px system-ui;padding:20px;max-width:950px;margin:auto}a{color:#99d8c7}h1{font-size:22px}label{display:inline-flex;gap:7px;align-items:center;margin:8px}select,button{padding:9px;background:#243846;color:white;border:1px solid #607781;border-radius:5px}canvas{display:block;width:100%;height:380px;background:repeating-linear-gradient(0deg,#1c2b35 0px,#1c2b35 39px,#30404b 40px);border:1px solid #41515b;margin-top:15px}p{line-height:1.5;color:#b4c7d2}#status{white-space:pre-wrap}</style></head><body><a href="./infantry-test.html">실제 6v6 전투로 복귀</a><h1>수동 애니메이션 검사</h1><p>보존된 소스 클립의 아틀라스 검사입니다. 전투 병사나 AI를 조작하지 않습니다. 이전 FB 질주는 결함 비교용이며 자동 선택에서 제외됩니다. SR 원본의 사용자 승인 기록은 없으며, 후속 수트 리타기팅은 보존된 승인본입니다.</p><label>진영/모델 <select id="faction"><option>USMC</option><option>Russian</option><option>TacticalSuit</option></select></label><label>동작 <select id="animation"></select></label><label>방향 <select id="heading"><option value="0">E / SE screen</option><option value="1">SE / S screen</option><option value="2">S / SW screen</option><option value="3">SW / W screen</option><option value="4">W / NW screen</option><option value="5">NW / N screen</option><option value="6">N / NE screen</option><option value="7">NE / E screen</option></select></label><button id="play">일시정지</button><canvas id="canvas" width="900" height="380"></canvas><p id="status">불러오는 중…</p><script type="module" src="/src/infantry/trigger.js"></script></body></html>
