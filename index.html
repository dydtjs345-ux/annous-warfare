<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1720" />
    <title>Autonomous Warfare v0.3.0</title>
  </head>
  <body>
    <main id="app">
      <header>
        <div>
          <small>자율 전술 시뮬레이션</small>
          <h1>Autonomous Warfare <em>v0.3.0</em></h1>
        </div>
        <span id="counts"></span>
      </header>
      <div id="game"></div>
      <aside id="inspect" hidden aria-label="병사 전술 정보"><div class="inspect-controls"><button id="detail">자세히</button><button id="close-inspect" aria-label="병사 정보 닫기">닫기</button></div><div id="inspect-text" aria-live="off"></div></aside>
      <section class="prototype-controls" aria-label="소총수 시각 시제품 비교"><button id="prototype-toggle">시제품 #1: 꺼짐</button><label>크기 <select id="prototype-scale" aria-label="시제품 시각 크기"><option value="1">1.0×</option><option value="1.3">1.3×</option><option value="1.5">1.5×</option></select></label><span>미 해병 소총수 #1 전용</span></section>
      <nav>
        <button id="pause">일시정지</button
        ><button data-speed="1" class="active">1×</button
        ><button data-speed="2">2×</button><button data-speed="4">4×</button
        ><button id="restart">재시작</button><button id="focus" aria-label="카메라 초점: 미 해병대">USMC</button>
      </nav>
      <div id="outcome" hidden></div>
      <footer>
        ELIMINATION · USMC vs Russian infantry · autonomous squads
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
