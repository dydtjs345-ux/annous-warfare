name: Check combined game and animation preview

on:
  pull_request:
    paths:
      - 'animation-preview-pages/**'
      - 'scripts/stage-animation-preview.mjs'
      - 'scripts/verify-pages-preview.mjs'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/check-animation-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify unchanged game files and append preview
        run: node scripts/stage-animation-preview.mjs
