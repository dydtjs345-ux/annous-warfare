<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1720" />
    <title>Autonomous Warfare · Infantry 6v6 Test</title>
  <style>
[hidden]{display:none!important}.infantry-controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 12px;background:#16232e;font-size:11px}.infantry-controls label{display:flex;align-items:center;gap:5px}.infantry-controls select{max-width:140px;background:#243642;color:#e5eeee;border:1px solid #49606e;border-radius:5px;padding:5px}.infantry-controls a{color:#94d4cc}#infantry-status{font-size:10px;padding:4px 12px;color:#a8bbc5}canvas{image-rendering:auto!important}
</style></head>
  <body data-infantry-test="true">
    <main id="app">
      <header>
        <div>
          <small>ISOLATED TEST · EXISTING COMBAT AI</small>
          <h1>Autonomous Warfare <em>INFANTRY TEST</em></h1>
        </div>
        <span id="counts"></span>
      </header>
      <div id="game">
        <div id="live-animation-debug" hidden aria-live="off"></div>
      </div>
      <aside id="inspect" hidden aria-label="병사 전술 정보">
        <div class="inspect-controls">
          <button id="detail">자세히</button
          ><button id="close-inspect" aria-label="병사 정보 닫기">닫기</button>
        </div>
        <div id="inspect-text" aria-live="off"></div>
      </aside>
      <section hidden class="prototype-controls" aria-label="소총수 시각 시제품 비교">
        <button id="prototype-toggle">시제품 #1: 켜짐</button
        ><label
          >그림
          <select id="prototype-art" aria-label="시제품 그림 버전">
            <option value="v033" selected>v0.3.3 Animated</option>
            <option value="v031">v0.3.1</option>
            <option value="v030">v0.3.0</option>
          </select></label
        ><label
          >크기
          <select id="prototype-scale" aria-label="시제품 시각 크기">
            <option value="1">1.0×</option>
            <option value="1.3" selected>1.3×</option>
            <option value="1.5">1.5×</option>
          </select></label
        ><button id="animation-preview">SE 동작 보기</button
        ><span>미 해병 #1 · SE 새 동작 / 그 외 기존</span>
      </section>
      <section class="infantry-controls">
        <label>Visuals <select id="infantry-quality"><option value="sprites">New infantry</option><option value="legacy">Legacy fallback</option></select></label>
        <label>Sprint <select id="infantry-sprint"><option value="new">Rebuilt · candidate</option><option value="old">Previous</option></select></label>
        <a href="./infantry-trigger.html">Visual-only triggers</a>
        <a href="https://autonomous-warfare-infantry-preview.companionablejellyfish2.chatgpt.site/" target="_blank" rel="noopener">Korean 3D preview ↗</a>
      </section>
      <div id="infantry-status" role="status">Loading infantry atlases…</div>
      <nav>
        <button id="pause">일시정지</button
        ><button data-speed="1" class="active">1×</button
        ><button data-speed="2">2×</button><button data-speed="4">4×</button
        ><button id="restart">재시작</button
        ><button id="focus" aria-label="카메라 초점: 미 해병대">USMC</button>
      </nav>
      <div id="outcome" hidden></div>
      <footer>
        ELIMINATION · USMC vs Russian infantry · autonomous squads
      </footer>
    </main>
    <dialog id="animation-dialog" aria-labelledby="animation-dialog-title">
      <header>
        <h2 id="animation-dialog-title">v0.3.3 · SE 동작 시연</h2>
        <button data-preview-close aria-label="동작 미리보기 닫기">닫기</button>
      </header>
      <div class="animation-preview-host"></div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
